name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest
      - name: Puxar configuracao da Vercel
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Buildar projeto
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Publicar preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
      - name: Comentar URL no PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview publicado: ${{ steps.deploy.outputs.preview_url }}`
            })
      - name: Testar health check do preview
        run: |
          sleep 5
          curl -f "${{ steps.deploy.outputs.preview_url }}/health"
